services:
  database:
    image: postgres
    ports:
      - "5438:5432"
    env_file:
      - .env.prod
    volumes:
      - pgdb:/var/lib/postgres/data/
  webapp:
    build:
      context: .
      dockerfile: ./Dockerfile.prod
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    env_file:
      - .env.prod
    volumes:
      - .:/rails
    ports:
      - "3007:3000"
    depends_on:
      - database

volumes:
  pgdb:
